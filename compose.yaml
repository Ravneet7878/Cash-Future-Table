services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATA_DIR: /data
      NSE_CM_CONTRACT_FILE: ${NSE_CM_CONTRACT_FILE:-nse_cm_ref_contract_master.csv}
      NSE_FO_CONTRACT_FILE: ${NSE_FO_CONTRACT_FILE:-nse_fo_ref_contract_master.csv}
      NSE_CM_MARKET_DATA_FILE: ${NSE_CM_MARKET_DATA_FILE:-nsecm_market_data.csv}
      NSE_FO_MARKET_DATA_FILE: ${NSE_FO_MARKET_DATA_FILE:-nsefo_market_data.csv}
      REPLAY_BATCH_SIZE: ${REPLAY_BATCH_SIZE:-500}
      WEBSOCKET_PATH: ${WEBSOCKET_PATH:-/ws}
      DB_POOL_MAX: 10
      DB_CONNECTION_TIMEOUT_MS: 5000
      SHUTDOWN_TIMEOUT_MS: 10000
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - type: bind
        source: ${DATA_DIR:?DATA_DIR must be set in .env}
        target: /data
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
